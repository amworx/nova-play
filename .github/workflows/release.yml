name: Release APK

# Push a tag like v1.0.1 to build a signed-by-debug-keys APK and attach it to
# a GitHub Release. The in-app updater (Settings → App updates) installs
# exactly this asset, so the name pattern matters: nova-play-<tag>.apk.
#
# Versioning: --build-name comes from the tag, --build-number from the run
# number, so every release has a strictly increasing Android versionCode and
# installs cleanly over the previous one — no pubspec edits needed.
#
# TODO(production-signing): release builds currently use debug keys (same as
# android/app/build.gradle.kts). Before Play Store submission, add a real
# upload keystore via GitHub Secrets and wire signingConfigs.release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name="$TAG" \
            --build-number="${GITHUB_RUN_NUMBER}"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/nova-play-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build/app/outputs/flutter-apk/nova-play-${GITHUB_REF_NAME}.apk" \
            --title "Nova Play ${GITHUB_REF_NAME}" \
            --generate-notes
