name: nova_play
description: "Beautiful, fast, offline-first local video player for smartphones."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  video_player: ^2.14.0
  photo_manager: ^3.12.0
  permission_handler: 12.0.1
  shared_preferences: ^2.5.5
  hugeicons: ^1.2.0
  wakelock_plus: ^1.8.0
  screen_brightness: ^2.1.11
  volume_controller: ^3.7.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  ota_update: ^7.1.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
